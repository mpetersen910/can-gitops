# Burst sender: pulses of 0x7FF on can0, next to the standard gencan.
#
# Both share can0's transmit queue, which is first come, first served. During
# a pulse the schedule's frames wait behind 0x7FF or get dropped, even though
# every one of them outranks 0x7FF on the bus. That is priority inversion
# inside one node; arbitration never gets a say. colcan shows it as late and
# missing frames on the schedule's IDs.
#
# Never give this an ID the standard schedule uses: arbitration can't separate
# two senders on the same ID. The competing node on can1 is gencan-event.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: gencan-burst
  namespace: default
  labels:
    app: gencan-burst
spec:
  selector:
    matchLabels:
      app: gencan-burst
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  template:
    metadata:
      labels:
        app: gencan-burst
    spec:
      # SocketCAN is network-namespace-scoped; without this there is no can0.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet

      nodeSelector:
        hardware: can
      tolerations:
        - key: hardware
          operator: Equal
          value: can
          effect: NoSchedule

      terminationGracePeriodSeconds: 10

      containers:
        - name: gencan
          image: 192.168.50.1:5000/gencan:main-1f6ce0e-1755000000 # {"$imagepolicy": "flux-system:gencan"}
          args:
            - -mode=burst
            - -iface=can0
            - -burst-id=7FF
            - -burst-count=200
            - -burst-every=60s     # periodic spike, gives the dashboard shape

          # Transmit only: nothing to scrape or probe.
          securityContext:
            capabilities:
              drop: ["ALL"]
              add: ["NET_RAW"]
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false

          resources:
            requests:
              cpu: 20m
              memory: 16Mi
            limits:
              memory: 64Mi
